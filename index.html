<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110e0c">
<meta name="color-scheme" content="dark">
<meta name="description" content="BYOA - Build Your Own Adventure Story Building by Jaken: voiced choose-your-own-adventure stories that run in any browser, on phones and desktops, with no install.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BYOA">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Build Your Own Adventure Story Building - BYOA by Jaken</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:24px;color:#eadfc8;font-family:sans-serif">BYOA needs JavaScript. Please enable it in your browser and reload.</p></noscript>
<div id="app">
  <header id="top">
    <div class="brand" id="brand">⚜ BYOA · Build Your Own Adventure Story Building</div>
    <div class="bars" id="bars" style="visibility:hidden">
      <div class="bar hp"><i id="hpbar"></i><span id="hptxt"></span></div>
      <div class="bar mp"><i id="mpbar"></i><span id="mptxt"></span></div>
      <div class="bar xp"><i id="xpbar"></i><span id="xptxt"></span></div>
    </div>
    <div class="chips" id="hdrchips"></div>
    <div class="voice">
      <button id="bVoice">🔊 Voice on</button>
      <button id="bOpts">📢 Reads choices</button>
      <button id="bSkip" title="Skip the voice (Space)">⏭</button>
      <button id="bPanel" class="mob">📋 Panels</button>
      <button id="bMenu">☰ Menu</button>
    </div>
  </header>
  <main>
    <section id="art"></section>
    <section id="story"></section>
    <section id="opts"></section>
  </main>
  <aside>
    <div class="panelhead mob"><b>Your journey</b><button id="bClosePanel">✕ Close</button></div>
    <nav id="tabs">
      <button data-t="log" class="on">📜 Choices</button>
      <button data-t="hero">🧙 Hero</button>
      <button data-t="pack">🎒 Pack</button>
      <button data-t="party">🤝 Party</button>
    </nav>
    <div id="rbody"></div>
  </aside>
</div>
<div id="modal"></div>
